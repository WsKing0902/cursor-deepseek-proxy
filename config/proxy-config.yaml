# deepseek-cursor-proxy 运行配置（Docker 挂载到 /data/config.yaml）
# API Key 由 Cursor 请求头 Authorization 转发，不在此文件保存。

base_url: https://api.deepseek.com
model: deepseek-v4-pro
thinking: enabled
reasoning_effort: high
display_reasoning: true
collasible_reasoning: true

host: 0.0.0.0
port: 9000
ngrok: false
verbose: false
request_timeout: 300
max_request_body_bytes: 20971520
cors: false

reasoning_content_path: reasoning_content.sqlite3
missing_reasoning_strategy: recover
reasoning_cache_max_age_seconds: 2592000
reasoning_cache_max_rows: 100000
